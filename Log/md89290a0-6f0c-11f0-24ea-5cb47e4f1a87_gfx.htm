function Print(singlePage, submenu) {

	document.getElementById(submenu).style.visibility = "hidden";

	var zoomFactor = zoom.getZoomValue();

	var constPageHeight = 842;
	var constPageWidth = 595;
	var constDoubleMargin = 136;
	var constFullPageHeight = constPageHeight + constDoubleMargin;
	var constFullPageWidth = constPageWidth  + 54;
	var imageHeight = document.getElementById("md89290a0-6f0c-11f0-24ea-5cb47e4f1a87").offsetHeight;
	var imageWidth = document.getElementById("md89290a0-6f0c-11f0-24ea-5cb47e4f1a87").offsetWidth;
	var heightSteps = Math.ceil(imageHeight/constPageHeight);
	var widthSteps = Math.ceil(imageWidth/constPageWidth);
	var constFullPageHeightStep = constFullPageHeight * heightSteps;
	var i = 0;
	var j = 0;
	
	var div = document.getElementById('print');

	removeAllChildren(div);

	var hCorr = constFullPageHeight/imageHeight;
	var wCorr = constFullPageWidth/imageWidth;
	
	if ((imageHeight <= constPageHeight) && (imageWidth <= constPageWidth)) {
			var p = document.createElement('p');
			p.innerHTML = '<img id=\"md89290a0-6f0c-11f0-24ea-5cb47e4f1a87\"src=\"md89290a0-6f0c-11f0-24ea-5cb47e4f1a87_'+zoomFactor+'.png\" style=\"width='+imageWidth+'; height='+imageHeight+';\"></img>';		
			div.appendChild(p);
		}

	else if (singlePage) {
			if (hCorr < wCorr) {
				var p = document.createElement('p');
				var h = imageHeight * hCorr;
				var w = imageWidth * hCorr;
				p.innerHTML = '<img id=\"md89290a0-6f0c-11f0-24ea-5cb47e4f1a87\"src=\"md89290a0-6f0c-11f0-24ea-5cb47e4f1a87_'+zoomFactor+'.png\" style=\"width='+w+'; height='+h+';\"></img>';		
				div.appendChild(p);
			}
			else {
				var p = document.createElement('p');
				var h = imageHeight * wCorr;
				var w = imageWidth * wCorr;
				p.innerHTML = '<img id=\"md89290a0-6f0c-11f0-24ea-5cb47e4f1a87\"src=\"md89290a0-6f0c-11f0-24ea-5cb47e4f1a87_'+zoomFactor+'.png\" style=\"width='+w+'; height='+h+';\"></img>';		
				div.appendChild(p);
			}
		
	}
	else {	
		while(i < widthSteps) {
			while(j < heightSteps) {
				var p = document.createElement('p');
				if (isIE) {
					p.style.setAttribute('position', 'static');
					p.style.setAttribute('page-break-after', '');
				}
				else {
					p.setAttribute('style', 'position:static');
					p.setAttribute('style', "page-break-after:''");
				}
				p.innerHTML = '<img id=\"md89290a0-6f0c-11f0-24ea-5cb47e4f1a87\"src=\"md89290a0-6f0c-11f0-24ea-5cb47e4f1a87_'+zoomFactor+'.png\" style=\"position:absolute; top:'+i*constFullPageHeightStep+' px; left:-'+i*constFullPageWidth+' px; overflow:hidden;clip:rect('+j*constPageHeight+' px,  '+(i+1)*constFullPageWidth +' px,  '+(j+1)*constPageHeight+' px,  '+i*constFullPageWidth+' px )\"></img>';		
				div.appendChild(p);
				j=j+1;
				
			}
			j=0;
			i=i+1;
		}
	}
	
	top.data.focus();
	window.print();
	
}

function removeAllChildren(targetElement) {
    if (targetElement && targetElement.childNodes) {
